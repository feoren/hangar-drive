[package]
name = "hangar-drive-server"
version = "0.1.0"
description = "Sync server of Hangar Drive: distributes changes to every client and keeps versions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "hangar_drive_server"

[[bin]]
name = "hangar-drive-server"
path = "src/main.rs"

# Versions follow the sister relay server (hangar-server) where it uses the same crate, so both
# servers move together. Every crate below is under the license allowlist of ADR 0001, section 8
# (MIT or Apache-2.0; rustls and ring add ISC).
[dependencies]
# The wire types and protocol version shared with the app (this repository, MIT).
hangar-drive-protocol.workspace = true
# The checks the server runs on log entries, commits, records, sessions and objects (this
# repository, MIT). A path dependency: the server uses the same verifier as the app.
hangar-drive-crypto.workspace = true
# HTTP routing, JSON and SSE replies. tokio-rs, MIT. `matched-path` names the route pattern for
# the access table and the logs (never the path, which carries IDs).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }
# The connection loop itself: axum's `serve` sets no timer, so it has no header read deadline
# (slowloris) and no TLS. MIT, already in the tree through axum; same versions as hangar-server.
hyper = { version = "1.9", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["http1", "server", "service", "tokio"] }
# `Layer` to put the client address in front of the router, per connection. MIT, through axum.
tower = { version = "0.5", default-features = false }
# Async runtime, files, timers and signals. tokio-rs, MIT; already in the tree.
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
# Metadata in SQLite (ADR 0001, sections 3 and 8): WAL, migrations embedded in the binary,
# bound parameters only. MIT/Apache-2.0, launchbadge; same stack and version as hangar-server.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
# JSON of the wire types and of feed entries. MIT/Apache-2.0, see the workspace manifest.
serde.workspace = true
serde_json.workspace = true
# Error types in modules (project rule). MIT/Apache-2.0, see the workspace manifest.
thiserror.workspace = true
# SHA-256 of tokens, invites and rate limit keys. MIT/Apache-2.0, RustCrypto; the same version
# the crypto crate already uses, so the lock file holds no second copy for this purpose.
sha2 = "0.11"
# The sign-in challenge MAC (HMAC-SHA-256, truncated tag checked in constant time). MIT/Apache-2.0,
# RustCrypto; the version and feature the crypto crate already uses, so the lock file gains no copy.
hmac = { version = "0.13", features = ["zeroize"] }
# `Stream` for the SSE replies and for streaming object downloads. MIT/Apache-2.0, already in
# the tree through axum and hyper; without default features (no executor, no macros).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Structured logs to stdout (read by `docker logs`). tokio-rs, MIT; same versions as
# hangar-server. Without `ansi`: no color codes in container logs.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
# Optional TLS termination in the server (ADR 0001, section 6: TLS 1.3 at the server or a
# reverse proxy). rustls: Apache-2.0/MIT/ISC, with ring as the provider like hangar-server, so no
# C toolchain beyond what ring needs and no second provider. TLS 1.2 stays off.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The binary's error type at its boundary (project rule: anyhow only in the binary).
# MIT/Apache-2.0, dtolnay; already in the app's tree.
anyhow = "1"

# Free disk space for the disk reserve (`statvfs`). MIT/Apache-2.0, already in the tree through
# tokio on every Unix target; the server image runs on Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests talk raw HTTP/1.1 over real sockets; the TLS test uses the same rustls as the server.
tokio = { version = "1.54", features = ["io-util", "time"] }
serde_json.workspace = true
