# Fuzz targets of the crypto and protocol crates (ADR 0001, Amendment, robustness), one per
# decoder and one for the folder delta check. A package of its own outside the Cargo workspace:
# it needs nightly and cargo-fuzz and is not part of the check suite or CI.
#
#   cargo install cargo-fuzz
#   cd crates/hangar-drive-crypto/fuzz
#   cargo +nightly fuzz list
#   cargo +nightly fuzz run decode_commit -- -max_total_time=300
[package]
name = "hangar-drive-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, so the repository's workspace neither builds nor checks it.
[workspace]

[dependencies]
# The libFuzzer runtime and the `fuzz_target!` macro. MIT OR Apache-2.0 OR NCSA, rust-fuzz;
# the standard harness of cargo-fuzz, only in this package.
libfuzzer-sys = "0.4"
hangar-drive-crypto = { path = ".." }
hangar-drive-protocol = { path = "../../hangar-drive-protocol" }
# The API JSON target decodes the wire types with the parser server and client use. MIT OR
# Apache-2.0, the workspace's versions.
serde = "1"
serde_json = "1"

[profile.release]
debug = 1

[[bin]]
name = "decode_log_entry"
path = "fuzz_targets/decode_log_entry.rs"
test = false
doc = false
bench = false

