[package]
name = "hangar-drive-sync"
version = "0.1.0"
description = "Sync engine of Hangar Drive: three trees, one control loop, merge, chunking, the local index, the file system watcher and the HTTP client of the server API"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The in-memory ports (`memory`) and their change source, for the integration tests and the
# seeded simulation of this crate and for tests of crates that build on it. Off by default, so a
# release build never compiles the test doubles.
test-support = []

[dependencies]
# Wire types, plaintext formats and the name policy. This repository, MIT.
hangar-drive-protocol.workspace = true
# Objects, commits, the verified chain, the device log, epochs and key rings. This repository, MIT.
hangar-drive-crypto.workspace = true
# Error types of every module (project rule). MIT/Apache-2.0, see the workspace manifest.
thiserror.workspace = true
# The public API's types are JSON for the app's window, and the server API is JSON.
# MIT/Apache-2.0, see the workspace manifest.
serde.workspace = true
serde_json.workspace = true
# SHA-256 of chunk ID lists (content keys) and of object plaintexts (object cache). MIT/Apache-2.0,
# RustCrypto; the same version the crypto crate uses, so the lock file holds one copy.
sha2 = "0.11"
# Wipes secrets the engine holds briefly (exported keys, keychain values). MIT OR Apache-2.0, no
# dependencies; the crypto crate uses the same version.
zeroize = "1"
# The change watcher (ADR 0001, section 3: the trigger; the hourly scan is the truth). Version 9
# raises the Windows buffer to 64 KiB per watch and reports a rescan event when
# ReadDirectoryChangesW drops details, which starts a full scan here.
# License CC0-1.0, outside the MIT, Apache-2.0 and BSD policy: accepted as the documented
# exception of ADR 0001, section 8, because CC0 waives all rights and is more permissive than MIT;
# the sister app ships the same exception. Its Linux backend `inotify` is ISC (equivalent to MIT)
# and on the license allowlist, so it needs no exception. Maintained by notify-rs, the standard watcher of
# the Rust ecosystem (used by cargo-watch, rust-analyzer, Deno). Needs Rust 1.91 (workspace MSRV).
notify = "9"
# The local index (ADR 0001, section 3): size, mtime and file ID per path, the three trees, the
# frontier and the journal of planned operations, in one SQLite file in the platform's config
# directory. MIT, the standard SQLite binding; `bundled` compiles SQLite into the app (public
# domain), so no system library is needed. 0.42 pulls `libsqlite3-sys` 0.40, which `sqlx` 0.9.1
# of the server accepts as well (below 0.41): Cargo allows only one SQLite build per workspace
# (`links = "sqlite3"`), and `libsqlite3-sys` below 0.39 carries a known advisory (server
# security review M7).
rusqlite = { version = "0.42", features = ["bundled"] }
# HTTP client of the server API. MIT OR Apache-2.0, seanmonstar, already in the app's tree
# through Tauri. Blocking: the sync engine runs one control thread (ADR 0001, section 3) and the
# client brings its own small runtime. `rustls-no-provider`: TLS through rustls with the `ring`
# provider below and a verifier this crate builds (SPKI pin or platform verifier), no OpenSSL and
# no aws-lc (which needs CMake and NASM on Windows).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
# TLS 1.3 only (ADR 0001, section 6) with the SPKI pin checked inside the handshake, so a device
# whose pin does not match aborts before it sends a proof or a token. Apache-2.0 OR ISC OR MIT,
# the rustls project; reqwest uses the same version. The `ring` provider: ring is
# Apache-2.0 AND ISC (ISC is equivalent to MIT and on the allowlist of ADR 0001, section 8), compiled
# with the C compiler that is already needed for SQLite.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
# The operating system's certificate verifier for servers with a certificate from a public CA.
# MIT OR Apache-2.0, the rustls project; already pulled by reqwest's rustls feature.
rustls-platform-verifier = "0.7"
# Parses the server's end entity certificate to read its SubjectPublicKeyInfo for the pin.
# ISC (equivalent to MIT, see above), the rustls project; already pulled by rustls.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
# The platform's config directory for the local index (`%APPDATA%`, `~/Library/Application
# Support`, `~/.config`). MIT OR Apache-2.0, already in the app's tree through Tauri.
dirs = "7"

[target.'cfg(windows)'.dependencies]
# GetLongPathNameW (8.3 short names from watcher events, ADR 0001, section 7),
# GetVolumeInformationW (FAT and exFAT get a 2 s mtime tolerance), CreateFileW with
# FILE_FLAG_OPEN_REPARSE_POINT for the file IDs of path components (security review L1),
# MoveFileExW without MOVEFILE_REPLACE_EXISTING (L2), ReplaceFileW with a backup (L3) and
# RegGetValueW for OneDrive's folders (M4). MIT OR Apache-2.0, Microsoft; already in the tree
# through Tauri and notify, the same version. (The NTFS file IDs come from CreateFileW and
# GetFileInformationByHandleEx here as well, so the `file-id` crate is no longer needed.)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry"] }
# The recycle bin for files that other devices deleted (security review M2): `IFileOperation`
# with `FOFX_RECYCLEONDELETE` is the shell's own way to recycle, the one Explorer uses, and it
# reports per item whether the item went to the recycle bin, so a drive without one is detected
# instead of the file being deleted for good (measured, see `src/trash.rs`). COM interfaces need
# generated bindings with reference counting, which `windows-sys` does not have. MIT OR
# Apache-2.0, Microsoft; already in the tree through Tauri (wry, tao), the same version, so only
# features are added. `SHFileOperationW` was not taken: Microsoft documents `IFileOperation` as
# its replacement, and it gives no per item result.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# The `implement` macro for the progress sink of `IFileOperation` expands to paths of this crate,
# so it is named directly. MIT OR Apache-2.0, Microsoft; the version `windows` 0.62 uses.
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
# NSFileManager trashItemAtURL for files that other devices deleted (security review M2), the
# Finder's own trash with its "put back". MIT, madsmtm; already in the tree
# through Tauri (tao, wry), the same version; only the four classes are enabled.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(unix)'.dependencies]
# renameat2(RENAME_NOREPLACE) on Linux and renamex_np(RENAME_EXCL) on macOS: a rename that never
# replaces an existing name, in one system call (security review L2), and O_NOFOLLOW. MIT OR
# Apache-2.0, the Rust project; already in the tree through getrandom, ring, notify and others.
# Chosen over `rustix` (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT), which is not in
# the lock file and would add a crate for the same two calls.
libc = "0.2"

[dev-dependencies]
# The crate itself with its test doubles, for the integration tests and the simulation under
# `tests/`, which link the library without `cfg(test)`.
hangar-drive-sync = { path = ".", features = ["test-support"] }
# The real sync server for the end-to-end test (`tests/e2e_server.rs`): it is built and served in
# the test process with the same `build` and `serve` the binary runs, on a real socket and a data
# folder under `tests/.tmp/`. This repository, MIT; a dev-dependency only, so the app never links
# the server.
hangar-drive-server = { path = "../../server" }
# The runtime the server's `serve` needs in that test. MIT, tokio-rs; the version and features
# the server already uses, so the lock file gains no crate.
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
