# One Cargo workspace for every Rust package: one lock file, one `target/` and one check suite
# (`cargo fmt --all`, `cargo clippy --workspace`, `cargo test --workspace`). The app and the
# server share the protocol crate by path, so a change to it is built and tested against both.
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/hangar-drive-protocol",
    "crates/hangar-drive-crypto",
    "crates/hangar-drive-sync",
    "server",
]
# The fuzz targets need nightly and cargo-fuzz; they are a package of their own.
exclude = ["crates/hangar-drive-crypto/fuzz"]

[workspace.package]
edition = "2021"
# `notify` 9, the change watcher of the sync engine, needs Rust 1.91 (ADR 0001, section 8: the
# workspace MSRV goes to 1.91 with the first change that adds it). Local builds and CI use the
# toolchain pinned in `rust-toolchain.toml`.
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
hangar-drive-protocol = { path = "crates/hangar-drive-protocol" }
hangar-drive-crypto = { path = "crates/hangar-drive-crypto" }
# Wire types (JSON). MIT/Apache-2.0, the de facto standard, maintained by serde-rs; already in
# the app's tree through Tauri.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error types in modules (project rule). MIT/Apache-2.0, dtolnay; already in Tauri's tree.
thiserror = "2"

# Unoptimized, the curve and hash arithmetic makes the crypto crate's tests slow: the device log
# tests sign and verify thousands of entries. Optimizing only these dependencies keeps
# `cargo test` fast without slowing the build of the app's own code.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Integer overflow panics in release builds too (security review, info), as it does in debug
# builds and tests. Without it an overflow wraps silently in the shipped app and server: a
# length, counter, sequence or byte count computed from a server's or a client's input would
# turn into a small value and pass a bound it should fail. The code uses checked and
# saturating arithmetic where an overflow is expected; anywhere else a panic ends one request
# or round instead of corrupting state. The setting covers the dependencies as well; crates
# that mean to wrap (the hash and cipher code) use explicit wrapping arithmetic, so only their
# speed can change, by a few percent in arithmetic-heavy code [UNVERIFIED: not measured here].
[profile.release]
overflow-checks = true
