# The check suite (see CONTRIBUTING.md) on Windows, macOS and Linux, the server image and the
# dependency audit.
name: CI

on:
  push:
    branches: [main]
    # A push that only touches documentation or the wiki changes nothing the check suite tests,
    # so it starts no run on three platforms.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:

# The check suite only reads, so a pull request from a fork gets no write access.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A hung test or install must not hold a runner for the default six hours.
    timeout-minutes: 60
    steps:
      # Third-party actions are pinned to a commit (a tag can be moved); Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step pushes; the token must not stay in .git/config for the build scripts
          # and test programs that run after it.
          persist-credentials: false

      # Without a `version` input the action installs the pnpm that `packageManager` in
      # package.json names, so that field is the only source.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Per the Tauri prerequisites for Linux: WebKitGTK 4.1 and companion libraries.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      # bash, not the Windows default pwsh: pwsh only reports the exit code of the last line, so a
      # failing format check, lint or test would pass the step as long as the build succeeds.
      - name: Frontend
        shell: bash
        run: |
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm build

      # After pnpm build, because tauri::generate_context! expects the dist/ folder. One workspace
      # holds every Rust package (app, protocol crate, server). --locked: the build uses exactly
      # Cargo.lock and fails if it would have to change it. --no-fail-fast: a failing test binary
      # must not hide the binaries after it.
      - name: Backend
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast

  # The server image as users build it: from the repository root with server/Dockerfile. It must
  # start as a container and answer its health endpoint, then stop cleanly on SIGTERM.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f server/Dockerfile -t hangar-drive-server:ci .

      - name: Start test
        run: |
          set -euo pipefail
          docker run -d --name drive -p 127.0.0.1:8080:8080 --read-only --cap-drop ALL \
            hangar-drive-server:ci
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8080/api/v1/health); then
              break
            fi
            sleep 1
          done
          echo "Health: ${body:-none}"
          grep -q '"protocol_version":' <<<"${body:-}"
          docker exec drive /usr/local/bin/hangar-drive-server healthcheck
          docker stop drive
          docker logs drive
          [ "$(docker inspect -f '{{.State.ExitCode}}' drive)" = 0 ]
          {
            echo "### Server image"
            echo "- Size: \`$(docker image inspect -f '{{.Size}}' hangar-drive-server:ci) bytes\`"
            echo "- Health: \`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # On a failed start test the container's own log is the first thing to read.
      - name: Server log
        if: failure()
        run: docker logs drive || true

  # Known vulnerabilities in the locked dependencies. cargo-audit is installed at a fixed version
  # from its own lock file; it fails on vulnerabilities and only warns about unmaintained crates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # One lock file for the whole workspace.
      - name: Rust dependencies
        run: cargo audit

      # Reads pnpm-lock.yaml only; nothing is installed or run.
      - name: npm dependencies
        run: pnpm audit --prod
