# Hangar Drive server, built from this repository.
#
#   echo "HANGAR_DRIVE_PUBLIC_URL=https://drive.example.org/" > .env
#   docker compose up -d --build
#   curl http://localhost:8080/api/v1/health
#   docker compose exec server hangar-drive-server invite
#
# The port is bound to localhost only: devices must reach the server through a reverse proxy
# with TLS (see docs/self-hosting.md and the commented Caddy service below). Settings come from
# the environment; put them into a .env file next to this one (never commit it).

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: hangar-drive-server:local
    restart: unless-stopped
    environment:
      HANGAR_DRIVE_PORT: "8080"
      HANGAR_DRIVE_DATA_DIR: /data
      # Required: the address devices reach the server under, for example
      # https://drive.example.org/ (put it into .env). Every sign-in is bound to it, and the
      # server does not start without it (docs/self-hosting.md, "Invite links").
      HANGAR_DRIVE_PUBLIC_URL: ${HANGAR_DRIVE_PUBLIC_URL:?set HANGAR_DRIVE_PUBLIC_URL in .env to the address devices reach this server under, for example https://drive.example.org/}
      # Retention and limits (docs/self-hosting.md, "Configuration"). The defaults apply when a
      # variable is empty.
      HANGAR_DRIVE_RETENTION_DAYS: ${HANGAR_DRIVE_RETENTION_DAYS:-30}
      HANGAR_DRIVE_RETENTION_MIN_COMMITS: ${HANGAR_DRIVE_RETENTION_MIN_COMMITS:-10}
      HANGAR_DRIVE_QUOTA: ${HANGAR_DRIVE_QUOTA:-100GiB}
      HANGAR_DRIVE_HEADROOM: ${HANGAR_DRIVE_HEADROOM:-}
      HANGAR_DRIVE_MIN_COUNT_CAP: ${HANGAR_DRIVE_MIN_COUNT_CAP:-}
      HANGAR_DRIVE_ACCOUNT_BUDGET: ${HANGAR_DRIVE_ACCOUNT_BUDGET:-}
      HANGAR_DRIVE_DEVICE_BUDGET: ${HANGAR_DRIVE_DEVICE_BUDGET:-}
      HANGAR_DRIVE_DISK_RESERVE: ${HANGAR_DRIVE_DISK_RESERVE:-1GiB}
      HANGAR_DRIVE_RECORD_CAP: ${HANGAR_DRIVE_RECORD_CAP:-}
      # Commits and record writes worked on at once, 1 to 4; their bodies are held in memory
      # (up to 80 MiB each), so this and mem_limit below go together.
      HANGAR_DRIVE_HEAVY_REQUESTS: ${HANGAR_DRIVE_HEAVY_REQUESTS:-4}
      # Uploads per account and minute (60 to 12000). Each file is at least two uploads, so
      # 1200 is about 10 small files a second; raise it for a faster first sync of many small
      # files if the disk keeps up (docs/self-hosting.md, "Configuration").
      HANGAR_DRIVE_UPLOADS_PER_MINUTE: ${HANGAR_DRIVE_UPLOADS_PER_MINUTE:-1200}
      # Reverse proxies whose X-Forwarded-For counts, by exact address. Empty by default: with
      # no proxy, nobody may set the client address. The caddy service below has the fixed
      # address 172.30.250.10; uncomment the next line together with it. An nginx on the host
      # reaches the server from the network's gateway, 172.30.250.1 (docs/self-hosting.md).
      # HANGAR_DRIVE_TRUSTED_PROXIES: 172.30.250.10
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - drive-data:/data
      # On a NAS, a folder instead of the volume, together with the folder owner's user and
      # group (docs/self-hosting.md, "On a NAS"):
      # - /volume1/drive:/data
    # user: "1000:100"
    ports:
      - "127.0.0.1:${HANGAR_DRIVE_HOST_PORT:-8080}:8080"
    networks: [drive]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # A ceiling for memory and processes, so a flood of large requests ends in refused
    # requests or a restart of this container, never in a host that swaps or runs out of PIDs.
    # 1 GiB covers HANGAR_DRIVE_HEAVY_REQUESTS (4) commits of the largest size, the database
    # page cache (16 MiB per connection, 8 connections: 128 MiB at most), a 256 KiB write
    # buffer per upload in flight and the rest. Raise it together with the heavy requests.
    # The server runs about a dozen threads plus one per CPU and at most 64 for file work.
    mem_limit: 1g
    pids_limit: 256
    # docker stop sends SIGTERM; the server ends its event streams, finishes open requests
    # within HANGAR_DRIVE_SHUTDOWN_GRACE_SECS (10 s) and exits well within this.
    stop_grace_period: 20s
    # One log line per request: rotate, so the logs never fill the disk the data lives on.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Reverse proxy with automatic HTTPS (Let's Encrypt). To use it: set DRIVE_DOMAIN in .env,
  # point the domain's DNS to this host, free ports 80 and 443, and uncomment this service and
  # the two volumes below. The Caddyfile is in docs/self-hosting.md.
  #
  # caddy:
  #   image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
  #   restart: unless-stopped
  #   depends_on: [server]
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     DRIVE_DOMAIN: ${DRIVE_DOMAIN:?set DRIVE_DOMAIN, e.g. drive.example.org}
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   networks:
  #     drive:
  #       # The one address the server trusts (HANGAR_DRIVE_TRUSTED_PROXIES above).
  #       ipv4_address: 172.30.250.10
  #   cap_drop: [ALL]
  #   cap_add: [NET_BIND_SERVICE]
  #   security_opt:
  #     - no-new-privileges:true
  #   mem_limit: 512m
  #   pids_limit: 256

# A network of its own with a fixed range, so the proxy's address is known and can be trusted
# exactly instead of a whole private range.
networks:
  drive:
    ipam:
      config:
        - subnet: 172.30.250.0/24
          gateway: 172.30.250.1

volumes:
  drive-data:
  # caddy-data:
  # caddy-config:
